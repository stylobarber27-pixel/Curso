<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyloBarber - Curso de Barbería</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .chat-bg {
      background-image: url('https://i.ibb.co/DPnftH9X/844fc286d4c8052cf4147c75f9343968.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .typing-indicator span {
      animation: blink 1.4s infinite both;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .2s; }
    .typing-indicator span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0% { opacity: .2; }
      20% { opacity: 1; }
      100% { opacity: .2; }
    }
  </style>
</head>
<body class="bg-zinc-950 text-white font-sans h-screen flex flex-col justify-between antialiased">

  <header class="p-3 bg-zinc-900/90 backdrop-blur border-b border-zinc-800 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="relative">
        <img src="https://i.ibb.co/VWLc5v9b/8a36c1fe02df62cdad2e70dff2f6e43e-1.jpg" alt="StyloBarber" class="w-11 h-11 rounded-full object-cover border-2 border-amber-500">
        <span class="w-3 h-3 bg-emerald-500 rounded-full absolute bottom-0 right-0 border-2 border-zinc-900"></span>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">StyloBarber</h1>
        <p class="text-xs text-amber-400 flex items-center gap-1">
          <i class="fa-solid fa-circle-check text-[10px]"></i> Academia & Comunidad
        </p>
      </div>
    </div>
  </header>

  <main class="flex-1 chat-bg overflow-y-auto p-4 space-y-4 relative">
    <div id="chat-container" class="max-w-md mx-auto space-y-4 pb-6">
    </div>
  </main>

  <footer id="footer-status" class="p-3 bg-zinc-900/90 border-t border-zinc-800 text-center text-xs text-zinc-400">
    <span id="status-text">StyloBarber está escribiendo...</span>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const statusText = document.getElementById('status-text');

    // Configuración Telegram
    const TELEGRAM_TOKEN = "8829825764:AAHUpW5txlSxLvtExh3zvzRet1v28iwLZ80";
    const TELEGRAM_CHAT_ID = "7951954749";

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function showTyping() {
      statusText.innerText = "StyloBarber está escribiendo...";
      const typingDiv = document.createElement('div');
      typingDiv.id = 'typing-node';
      typingDiv.className = 'flex items-center gap-2 max-w-[75%] p-3 rounded-2xl bg-zinc-900/90 text-zinc-300 border border-zinc-800 rounded-tl-none self-start';
      typingDiv.innerHTML = `<div class="typing-indicator flex gap-1"><span class="w-2 h-2 bg-amber-500 rounded-full"></span><span class="w-2 h-2 bg-amber-500 rounded-full"></span><span class="w-2 h-2 bg-amber-500 rounded-full"></span></div>`;
      chatContainer.appendChild(typingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function hideTyping() {
      const node = document.getElementById('typing-node');
      if (node) node.remove();
      statusText.innerText = "En línea";
    }

    async function addBotMessage(htmlContent) {
      await showTyping();
      await sleep(1200);
      hideTyping();

      const msg = document.createElement('div');
      msg.className = 'max-w-[85%] p-4 rounded-2xl bg-zinc-900/90 backdrop-blur text-zinc-100 border border-zinc-800/80 rounded-tl-none shadow-xl space-y-2';
      msg.innerHTML = htmlContent;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function addUserMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'max-w-[80%] p-3 rounded-2xl bg-amber-500 text-zinc-950 font-medium rounded-tr-none ml-auto shadow-md text-sm';
      msg.innerText = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function initChat() {
      await addBotMessage("¡Hola! Te doy la bienvenida a <b>StyloBarber</b>. 💈✂️");
      await addBotMessage("Mi meta es ayudarte a dominar el arte de la barbería con nuestro material especializado.");
      await showSurvey();
    }

    async function showSurvey() {
      await showTyping();
      await sleep(1000);
      hideTyping();

      const surveyDiv = document.createElement('div');
      surveyDiv.id = 'survey-box';
      surveyDiv.className = 'max-w-[85%] p-4 rounded-2xl bg-zinc-900/90 backdrop-blur text-zinc-100 border border-zinc-800 rounded-tl-none shadow-xl space-y-3';
      surveyDiv.innerHTML = `
        <p class="font-semibold text-amber-400">Para adaptar la experiencia, cuéntame: ¿Cuál es tu nivel actual?</p>
        <div class="flex flex-col gap-2">
          <button onclick="handleOption('Soy barbero profesional')" class="w-full text-left p-2.5 rounded-xl bg-zinc-800 hover:bg-amber-500 hover:text-black transition border border-zinc-700 text-xs font-medium">💈 Ya soy barbero (quiero perfeccionar)</button>
          <button onclick="handleOption('Estoy iniciando')" class="w-full text-left p-2.5 rounded-xl bg-zinc-800 hover:bg-amber-500 hover:text-black transition border border-zinc-700 text-xs font-medium">✂️ Estoy iniciando en la barbería</button>
          <button onclick="handleOption('Quiero aprender desde cero')" class="w-full text-left p-2.5 rounded-xl bg-zinc-800 hover:bg-amber-500 hover:text-black transition border border-zinc-700 text-xs font-medium">🚀 Quiero aprender desde cero</button>
        </div>
      `;
      chatContainer.appendChild(surveyDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function handleOption(optionText) {
      const surveyBox = document.getElementById('survey-box');
      if (surveyBox) surveyBox.remove();

      await addUserMessage(optionText);

      await addBotMessage("¡Excelente! Tenemos dos opciones de formación preparadas para ti:");

      // Selección de Producto / Paquetes
      await addBotMessage(`
        <div class="space-y-3">
          <p class="font-bold text-amber-400 text-base">📚 Selecciona tu Plan de Capacitación:</p>
          
          <div class="bg-zinc-800/80 p-3.5 rounded-xl border border-amber-500/50 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <h4 class="font-bold text-sm text-white">🎬 Curso Completo + Manual PDF</h4>
                <p class="text-[11px] text-zinc-400">Acceso ilimitado en Google Drive</p>
              </div>
              <span class="bg-amber-500 text-zinc-950 font-bold px-2 py-1 rounded text-xs">1,000 Bs</span>
            </div>
          </div>

          <div class="bg-zinc-800/80 p-3.5 rounded-xl border border-zinc-700 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <h4 class="font-bold text-sm text-white">📄 Solo Manual Barbería 0 a Experto</h4>
                <p class="text-[11px] text-zinc-400">Guía completa en formato PDF</p>
              </div>
              <span class="bg-zinc-700 text-amber-400 font-bold px-2 py-1 rounded text-xs">600 Bs</span>
            </div>
          </div>
        </div>
      `);

      // Datos de Pago y Formulario de Confirmación
      await addBotMessage(`
        <div class="space-y-3">
          <p class="text-xs text-zinc-300 leading-relaxed font-semibold text-amber-400">
            💳 Realiza tu pago mediante cualquiera de nuestros canales oficiales:
          </p>

          <div class="bg-zinc-800/90 p-3 rounded-xl border border-zinc-700 text-xs space-y-2">
            <div>
              <p class="text-amber-400 font-bold">🇻🇪 Pago Móvil (Bs):</p>
              <p class="text-zinc-300">• <b>Banco:</b> 0102 - Banco de Venezuela</p>
              <p class="text-zinc-300">• <b>Cédula:</b> V-27.636.123</p>
              <p class="text-zinc-300">• <b>Teléfono:</b> 0424-5367825</p>
            </div>
            <hr class="border-zinc-700">
            <div>
              <p class="text-amber-400 font-bold">🇺🇸 Métodos en USD:</p>
              <p class="text-zinc-300">• <b>PayPal:</b> manoogul56@gmail.com</p>
              <p class="text-zinc-300">• <b>Binance:</b> josuelugaliz7@gmail.com</p>
            </div>
          </div>

          <div id="payment-form-box" class="bg-zinc-800/90 p-3.5 rounded-xl border border-amber-500/40 space-y-2.5">
            <p class="text-xs font-bold text-white text-center">📝 FORMULARIO DE REPORTE DE PAGO</p>

            <div>
              <label class="text-[10px] text-zinc-400">Plan a adquirir:</label>
              <select id="user-plan" class="w-full bg-zinc-900 border border-zinc-700 text-white rounded-lg p-2 text-xs focus:outline-none focus:border-amber-500">
                <option value="Curso Completo + PDF (1000 Bs)">Curso Completo + PDF — 1,000 Bs</option>
                <option value="Solo Manual PDF (600 Bs)">Solo Manual PDF — 600 Bs</option>
              </select>
            </div>

            <input type="text" id="user-name" placeholder="Tu Nombre completo" class="w-full bg-zinc-900 border border-zinc-700 text-white rounded-lg p-2 text-xs focus:outline-none focus:border-amber-500">

            <input type="email" id="user-email" placeholder="Tu Correo electrónico" class="w-full bg-zinc-900 border border-zinc-700 text-white rounded-lg p-2 text-xs focus:outline-none focus:border-amber-500">
            
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="user-amount" placeholder="Monto transferido" class="bg-zinc-900 border border-zinc-700 text-white rounded-lg p-2 text-xs focus:outline-none focus:border-amber-500">
              <select id="user-method" class="bg-zinc-900 border border-zinc-700 text-white rounded-lg p-2 text-xs focus:outline-none focus:border-amber-500">
                <option value="Pago Móvil">Pago Móvil</option>
                <option value="PayPal">PayPal</option>
                <option value="Binance">Binance</option>
              </select>
            </div>

            <input type="text" id="user-ref" placeholder="N° de Referencia de pago" class="w-full bg-zinc-900 border border-zinc-700 text-white rounded-lg p-2 text-xs focus:outline-none focus:border-amber-500">

            <div id="error-message" class="text-[11px] text-red-400 hidden font-medium text-center"></div>

            <button onclick="validateAndReview()" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-2.5 rounded-lg text-xs transition shadow-lg flex items-center justify-center gap-2">
              <i class="fa-solid fa-magnifying-glass"></i> Verificar y Continuar
            </button>
          </div>
        </div>
      `);
    }

    // Validación de campos antes de enviar
    function validateAndReview() {
      const plan = document.getElementById('user-plan').value;
      const name = document.getElementById('user-name').value.trim();
      const email = document.getElementById('user-email').value.trim();
      const amount = document.getElementById('user-amount').value.trim();
      const method = document.getElementById('user-method').value;
      const ref = document.getElementById('user-ref').value.trim();
      const errorDiv = document.getElementById('error-message');

      errorDiv.classList.add('hidden');

      if (!name || !email || !amount || !ref) {
        errorDiv.innerText = "⚠️ Por favor, completa todos los campos del formulario.";
        errorDiv.classList.remove('hidden');
        return;
      }

      // Validación básica de formato de correo
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorDiv.innerText = "⚠️ Ingresa un correo electrónico válido.";
        errorDiv.classList.remove('hidden');
        return;
      }

      // Validación de longitud de referencia
      if (ref.length < 4) {
        errorDiv.innerText = "⚠️ El número de referencia debe tener al menos 4 dígitos.";
        errorDiv.classList.remove('hidden');
        return;
      }

      // Reemplaza el formulario por una vista previa de confirmación
      const formBox = document.getElementById('payment-form-box');
      formBox.innerHTML = `
        <div class="space-y-2 text-xs">
          <p class="font-bold text-amber-400 text-center">🔍 Confirmación de Datos</p>
          <p class="text-zinc-300">Por favor, verifica que la información sea correcta antes de enviar:</p>
          <div class="bg-zinc-900/90 p-2.5 rounded-lg space-y-1 text-zinc-200 border border-zinc-700">
            <p>• <b>Plan:</b> ${plan}</p>
            <p>• <b>Nombre:</b> ${name}</p>
            <p>• <b>Correo:</b> ${email}</p>
            <p>• <b>Monto:</b> ${amount}</p>
            <p>• <b>Método:</b> ${method}</p>
            <p>• <b>Referencia:</b> ${ref}</p>
          </div>
          <div class="flex gap-2 pt-1">
            <button onclick="sendOrder('${plan}', '${name}', '${email}', '${amount}', '${method}', '${ref}')" class="flex-1 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-2 rounded-lg text-xs transition">
              <i class="fa-solid fa-paper-plane mr-1"></i> Confirmar y Enviar
            </button>
          </div>
        </div>
      `;
    }

    // Envío final de la Orden directo a Telegram
    async function sendOrder(plan, name, email, amount, method, ref) {
      const formBox = document.getElementById('payment-form-box');
      formBox.innerHTML = `<p class="text-center text-xs text-amber-400 py-3"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Notificando pago a Telegram...</p>`;

      const messageText = `🛒 *NUEVA COMPRA - STYLOBARBER*\n\n📦 *Plan:* ${plan}\n👤 *Nombre:* ${name}\n📧 *Correo:* ${email}\n💰 *Monto:* ${amount}\n💳 *Método:* ${method}\n🧾 *Referencia:* ${ref}`;

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: messageText,
            parse_mode: 'Markdown'
          })
        });

        await addUserMessage(`Pago reportado: ${plan} - Ref: ${ref}`);
        await addBotMessage(`¡Muchas gracias <b>${name}</b>! 🎉<br><br>Hemos recibido tu reporte de pago. Verificaremos la transferencia y te enviaremos el enlace de acceso al correo: <b>${email}</b> en breve.`);
      } catch (err) {
        await addBotMessage("Hubo un detalle técnico al enviar la información. Descuida, guardaremos tu reporte y nos comunicaremos al correo especificado.");
      }
    }

    window.onload = initChat;
  </script>
</body>
</html>
